repository:
  title: fgrfn Unraid Templates
  description: Curated Docker templates for Unraid
  pages_base_url: https://fgrfn.github.io/unraid-templates
  github: https://github.com/fgrfn/unraid-templates
  default_timezone: Europe/Berlin
  notice: >-
    **Personal learning project:** Built with the help of OpenAI Codex and Claude Code
    as a way to experiment, learn and create something useful.
templates:
- id: hashhive
  path: templates/HashHive/my-HashHive.xml
  tags:
  - Mining
  - Dashboard
  ownership: first-party
  upstream:
    compose_url: https://raw.githubusercontent.com/fgrfn/hashhive/main/docker-compose.yml
    service: ''
    enabled: true
- id: reddit-wsb-crawler
  path: templates/RedditWSBCrawler/my-RedditWSBCrawler.xml
  tags:
  - Monitoring
  - Finance
  ownership: first-party
  upstream:
    compose_url: https://raw.githubusercontent.com/fgrfn/reddit-wsb-crawler/main/docker-compose.yml
    service: ''
    enabled: true
- id: scan2target
  path: templates/Scan2Target/my-Scan2Target.xml
  tags:
  - Scanning
  - Productivity
  ownership: first-party
  upstream:
    compose_url: https://raw.githubusercontent.com/fgrfn/Scan2Target/main/docker-compose.yml
    service: ''
    enabled: true
