name: Validate Templates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Validate XML and catalog
        id: template_validation
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python scripts/validate-templates.py 2>&1 | tee validation.log

      - name: Run tests
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pytest -q 2>&1 | tee pytest.log

      - name: Verify generated README
        if: always()
        run: python scripts/generate.py --check-readme

      - name: Build Pages artifact
        if: always()
        run: python scripts/generate.py --output _site

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: validation-reports
          path: |
            validation.log
            pytest.log
          if-no-files-found: error

      - name: Upload preview artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unraid-templates-site
          path: _site
          if-no-files-found: error

      - name: Enforce validation result
        if: steps.template_validation.outcome == 'failure' || steps.tests.outcome == 'failure'
        run: exit 1
